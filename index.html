<!DOCTYPE html>
<html>
<head>

  <title>Retour ACTEVO</title>
  <style>
    body{font-family:Arial;background:#050A1E;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}
    .box{padding:30px}

  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:48px">🌌</div>
    <h2>ACTEVO</h2>

    <p>Ken el app ma t7allatch automatiquement → <b>ezreb 3al bouton!</b></p>
  </div>
  <script>
    var target = 'suplaapp://callback' + location.search;
    document.getElementById('open').href = target;
    if (location.search.length > 0) {
      location.replace(target);   // essai automatique
    }
  </script>

</html>
