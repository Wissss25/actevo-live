<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retour ACTEVO</title>
  <style>
    body{font-family:Arial;background:#050A1E;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}
    .box{padding:30px}
    h2{letter-spacing:6px;margin:14px 0 4px}
    .btn{display:inline-block;margin-top:22px;padding:16px 36px;background:linear-gradient(135deg,#00E5FF,#7B61FF);color:#fff;font-weight:bold;font-size:17px;border-radius:14px;text-decoration:none;letter-spacing:1px}
    p{color:#8A93B2;font-size:13px}
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:48px">🌌</div>
    <h2>ACTEVO</h2>
    <a class="btn" id="open">📲 OUVRIR ACTEVO</a>
    <p>Ezreb 3al bouton bech trja3 lel app!</p>
  </div>
  <script>
    var q = location.search;
    // ⭐ intent:// → Chrome y7all el app DIRECT b' el package — BULLETPROOF!
    var url = 'intent://callback' + q + '#Intent;scheme=suplaapp;package=com.example.actevo;end';
    document.getElementById('open').href = url;
    if (q.length > 0) {
      location.replace(url);
    }
  </script>
</body>
</html>
